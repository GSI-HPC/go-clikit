# Weekly version updates.
# The Go release lines in go.mod and mise.toml are moved by hand
# (doc/decisions.md, decision 2).

version: 2

updates:
  # The requirements in go.mod: go-nodeset and golang.org/x/text, and
  # nothing else without a record (doc/decisions.md, decision 3). An update
  # that raises the go line of go.mod is closed: the requirement waits until
  # the line moves (decision 2).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # A release has a week to be found out before it is proposed. Security
    # updates do not wait, and neither do GSI-HPC's own modules, go-nodeset
    # among them.
    cooldown:
      default-days: 7
      exclude:
        - github.com/GSI-HPC/*
    commit-message:
      prefix: build
      include: scope
    # CI runs the whole suite on every pull request, so minor and patch
    # releases can travel together; GSI-HPC's modules travel apart, so that
    # their updates arrive without the others.
    groups:
      gsi-hpc:
        patterns: [github.com/GSI-HPC/*]
      go-modules:
        update-types: [minor, patch]

  # The actions the workflows use, one pull request each: the release
  # workflow does not run on pull requests, so a new major version of one of
  # its actions is reviewed on its own release notes.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup-go]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    commit-message:
      prefix: ci
      include: scope
