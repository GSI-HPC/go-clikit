name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both ends of the supported range: the go line in go.mod, which is what a
  # program importing the module may build with, and the release line
  # mise.toml names (doc/decisions.md, decision 2).
  # The displays draw on terminals, and the programs that use them run on
  # macOS too.
  test:
    name: Test (Go ${{ matrix.line }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {line: floor, os: ubuntu-latest}
          - {line: current, os: ubuntu-latest}
          - {line: current, os: macos-latest}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          line: ${{ matrix.line }}

      - name: Vet
        run: go vet ./...

      - name: Test under the race detector
        run: go test -race ./...

  # The cost tests of the live tree time it, so they skip under the race
  # detector the test jobs use. They run here without it, alone on their
  # runner, so that no other package's tests compete for its CPU, and each
  # logs how many times as long its larger size took, against its limit
  # (doc/decisions.md, decision 17).
  costs:
    name: Costs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - name: Measure the cost of a large step
        run: make costs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - name: Measure coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # Every file at 100% (.testcoverage.yml).
      - uses: vladopajic/go-test-coverage@v2
        with:
          config: .testcoverage.yml

  # Escaping and truncation never let a control character through and never
  # break UTF-8, and Sanitize never returns what a terminal would act on or
  # more than its bound, whatever text a remote host sends. A short run on
  # every change catches a regression; a failing input is committed under
  # the package's testdata/fuzz/, where every later run replays it.
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: termtext, target: FuzzEscape}
          - {package: termtext, target: FuzzTruncate}
          - {package: progress, target: FuzzSanitize}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - name: Fuzz
        run: make fuzz FUZZ=${{ matrix.package }}:${{ matrix.target }} FUZZTIME=60s

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - name: Check that the module requirements are tidy
        run: |
          set -euo pipefail
          make tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            git diff -- go.mod go.sum
            echo "::error::go.mod or go.sum is not as go mod tidy leaves it; run make tidy"
            exit 1
          fi

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  docs:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make lint-docs

  reuse:
    name: REUSE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every file states its copyright holder and licence
      # (doc/decisions.md, decision 1).
      - uses: fsfe/reuse-action@v6

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release-tag:
    name: Release tag verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The release workflow runs only when a tag is pushed, so the check that
      # refuses a tag is tested here against tags made on the spot.
      - name: Test the tag verification
        run: .github/scripts/verify-release-tag_test.sh
