#
# A release of a Go module is its tag: the module proxy serves whatever tag is
# pushed. This workflow refuses a tag that is not a signed statement by a
# listed signer, and then publishes the GitHub release, its notes the body of
# the tag message (doc/decisions.md, decision 4, and doc/release.md).
#
# A tag push runs this workflow as the tagged commit has it, so a tag on a
# commit from before the workflow, or on one that changes it, verifies
# nothing. The default branch therefore runs it on a schedule as well, and
# then verifies every release tag there is, and that the module proxy serves
# no version without one.

name: Release

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

# Read only, unless a job says otherwise: only the release job writes.
permissions:
  contents: read

jobs:
  # From the default branch: a release tag that is not signed by a listed
  # signer fails this job, whatever commit it names, and so does a version on
  # the module proxy whose tag is gone.
  audit-tags:
    name: Verify every release tag is signed
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a release tag not signed by a listed signer
        env:
          ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
          ALLOWED_PGP_KEYS: ${{ vars.RELEASE_ALLOWED_PGP_KEYS }}
        run: .github/scripts/audit-release-tags.sh

  # The jobs after this one need it, so on any event but a tag push they are
  # skipped with it.
  verify-tag:
    name: Verify the tag is signed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      object: ${{ steps.verify.outputs.object }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The keys are repository variables, which only an administrator can
      # change, and never a file in the checkout: the tagged commit would
      # otherwise name its own signers. Without them no release is published.
      - name: Refuse a tag not signed by a listed signer
        id: verify
        env:
          ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
          ALLOWED_PGP_KEYS: ${{ vars.RELEASE_ALLOWED_PGP_KEYS }}
        run: .github/scripts/verify-release-tag.sh

      - name: Refuse a version the go command would not accept
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/check-release-version.sh

  test:
    name: Test (Go ${{ matrix.line }})
    needs: verify-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        line: [floor, current]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          line: ${{ matrix.line }}
      - run: go vet ./...
      - run: go test -race ./...

  release:
    name: Publish
    needs: [verify-tag, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Protection rules on this environment, such as a rule that only v* tags
    # deploy, hold the release until they are met.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag may have moved since it was verified; what is published is the
      # tag object that was verified and the commit it names, or nothing.
      - name: Refuse a tag that moved since it was verified
        env:
          TAG: ${{ github.ref_name }}
          OBJECT: ${{ needs.verify-tag.outputs.object }}
          COMMIT: ${{ needs.verify-tag.outputs.commit }}
        run: |
          set -euo pipefail
          if [ -z "$OBJECT" ] || [ "$(git rev-parse --verify "refs/tags/$TAG")" != "$OBJECT" ]; then
            echo "::error::$TAG no longer points at the verified tag object $OBJECT"
            exit 1
          fi
          if [ "$(git rev-parse --verify HEAD)" != "$COMMIT" ]; then
            echo "::error::the checkout is not the verified commit $COMMIT"
            exit 1
          fi

      - uses: ./.github/actions/setup-go

      # pkg.go.dev lists a version once the module proxy has fetched it, so
      # the release is fetched once, from outside the module. The fetch comes
      # first: when the proxy fails, no GitHub release exists yet.
      - name: Fetch the release through the Go module proxy
        working-directory: ${{ runner.temp }}
        env:
          TAG: ${{ github.ref_name }}
          MODULE_FILE: ${{ github.workspace }}/go.mod
        run: go list -m "$(sed -n 's/^module //p' "$MODULE_FILE")@$TAG"

      # A release that exists already, from an earlier attempt of this job, is
      # left as it is, so that the job can be run again.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: .github/scripts/publish-release.sh
