# The documentation site in site/ (doc/decisions.md, decision 48): built on
# every pull request, so that a page that fails to build fails the check,
# and published to GitHub Pages from main. The tests of internal/docsite,
# which keep the site true to the code, run with the other tests in CI.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the build of a pull request, but never a deploy
# under way.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, for the list of releases and the version the site
          # shows; nothing in the tree names one (decision 4).
          fetch-depth: 0

      - name: Install Hugo at the version mise.toml names
        run: |
          version=$(sed -n 's/^hugo = "\(.*\)"$/\1/p' mise.toml)
          base="https://github.com/gohugoio/hugo/releases/download/v${version}"
          tarball="hugo_${version}_linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/hugo_${version}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "$tarball" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: List the releases from the tags
        run: python3 site/releases.py > site/data/releases.json

      - name: Find the base URL of the site
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build the site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          export HUGO_PARAMS_RELEASE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          hugo --source site --minify --panicOnWarning ${BASE_URL:+--baseURL "$BASE_URL/"}

      - name: Keep the site for the deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

  deploy:
    name: Publish the site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
