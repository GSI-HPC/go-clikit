#
# The GSI-HPC baseline of linters for Go modules. golangci-lint v2 cannot
# extend a remote configuration, so each module carries its own copy.

version: "2"

linters:
  enable:
    - copyloopvar
    - depguard
    - errcheck
    - errorlint
    - forbidigo
    - govet
    - ineffassign
    - misspell
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars

  settings:
    depguard:
      rules:
        # Every requirement of the kit becomes one of each tool that uses it,
        # so these stay out (doc/decisions.md, decision 3).
        never:
          deny:
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: an MCP bridge takes a send callback instead (doc/decisions.md, decision 3)
            - pkg: github.com/charmbracelet
              desc: displays write to an io.Writer themselves (doc/decisions.md, decision 3)
            - pkg: github.com/stretchr/testify
              desc: tests use the standard library; helpers live in xxxtest packages (doc/decisions.md, decision 3)
            - pkg: go.opentelemetry.io
              desc: report progress through the progress package (doc/decisions.md, decision 3)
        # Library packages import termtext, progress and fanout too, so
        # cobra and its flags reach only the package that is about cobra.
        cobra-only-in-cobratree:
          files:
            - $all
            - "!**/cobratree/**"
          deny:
            - pkg: github.com/spf13/cobra
              desc: only cobratree may import cobra (doc/decisions.md, decisions 3 and 24)
            - pkg: github.com/spf13/pflag
              desc: only cobratree may import pflag; cliprogress is given what a flag holds (doc/decisions.md, decisions 21 and 24)
        # The web side mirrors the cobra side: library packages import
        # termtext, progress and fanout too, so the HTTP server and its
        # templates reach only the packages that serve a page.
        web-only-in-localweb:
          files:
            - $all
            - "!**/localweb/**"
          deny:
            - pkg: net/http
              desc: only localweb and its packages serve a page (doc/decisions.md, decisions 25 and 34)
            - pkg: html/template
              desc: only localweb and its packages render a page (doc/decisions.md, decisions 25 and 34)
        # A server is no command line: localweb takes nothing of the
        # command's glue.
        localweb-without-the-command-line:
          files:
            - "**/localweb/**"
          deny:
            - pkg: github.com/GSI-HPC/go-clikit/progress/cliprogress
              desc: localweb imports no command-line glue (doc/decisions.md, decision 25)
        # The ioctls and fcntls cliprogress makes, the file lock of fsutil
        # and the lock of localweb/launch; every other package, the
        # localweb root among them, leaves the system alone or asks it
        # through syscall (doc/decisions.md, decisions 22, 26, 35 and 37).
        x-sys-only-where-decided:
          files:
            - $all
            - "!**/progress/cliprogress/**"
            - "!**/fsutil/**"
            - "!**/localweb/launch/**"
          deny:
            - pkg: golang.org/x/sys
              desc: only progress/cliprogress, fsutil and localweb/launch ask the system through golang.org/x/sys (doc/decisions.md, decisions 22, 26, 35 and 37)
    # The kit reads no environment, sets nothing process-wide and ends no
    # process (doc/decisions.md, decision 21): not through os, syscall or
    # golang.org/x/sys/unix, nor through log.Fatal.
    forbidigo:
      forbid:
        - pattern: ^(os|syscall|unix)\.(Getenv|LookupEnv|Environ|Setenv|Unsetenv|Clearenv|ExpandEnv|Exit)$
          msg: the kit reads no environment, sets nothing process-wide and ends no process (doc/decisions.md, decision 21)
        - pattern: ^log\.(Logger\.)?(Fatal|Fatalf|Fatalln)$
          msg: the kit ends no process; it returns an error (doc/decisions.md, decision 21)
        - pattern: ^signal\.(Notify|NotifyContext|Ignore|Reset|Stop)$
          msg: the end of the command's context is the interrupt; the program catches signals (doc/decisions.md, decision 21)
      analyze-types: true
    errcheck:
      # A deliberate discard is written as _ = f(), which reads as a decision
      # rather than an oversight.
      check-blank: false

  exclusions:
    rules:
      # A test may ignore an error where the failure it is provoking is the
      # point of the test.
      - path: _test\.go
        linters: [errcheck]
      # A test may set the environment, or exit, as the program it stands
      # in for would.
      - path: _test\.go
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
