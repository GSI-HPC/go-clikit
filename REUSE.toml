# The documentation site (doc/decisions.md, decision 48): the recordings
# of the displays and the data the pages are built from, which
# internal/docsite writes or checks, are JSON and hold no comment.
[[annotations]]
path = ["site/static/casts/*.json", "site/data/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 GSI Helmholtz Centre for Heavy Ion Research GmbH <http://www.gsi.de>"
SPDX-License-Identifier = "Apache-2.0"

# The fonts of the site, IBM Plex as Fontsource serves it, under the SIL
# Open Font License.
[[annotations]]
path = "site/static/fonts/ibm-plex-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"
